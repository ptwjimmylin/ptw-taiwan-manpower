        function renderMonthlyDispatchTable() {
            const tbody = document.getElementById('monthly-dispatch-tbody');
            if (!tbody) return;

            const picker = document.getElementById('dispatch-month-picker');
            if (picker && picker.value) {
                selectedDispatchMonth = picker.value;
            }

            const [year, month] = selectedDispatchMonth.split('-').map(Number);
            const daysInMonth = new Date(year, month, 0).getDate();
            const weekdayLabels = ['Sun 日', 'Mon 一', 'Tue 二', 'Wed 三', 'Thu 四', 'Fri 五', 'Sat 六'];
            const includePending = document.getElementById('toggle-include-pending')?.checked;
            const effectiveStaff = appSettings.totalStaff + simulatedExtraStaff;

            const rowsHtml = [];
            for (let day = 1; day <= daysInMonth; day++) {
                const dateStr = `${year}-${String(month).padStart(2, '0')}-${String(day).padStart(2, '0')}`;
                const dt = new Date(year, month - 1, day);
                const dow = dt.getDay();
                const isWeekend = (dow === 0 || dow === 6);

                const dayLogs = dailyDispatches.filter(item => item.date === dateStr);

                // 計算當日總人力負荷狀態
                const activeProjs = projects.filter(p => {
                    if (!includePending && p.status !== 'Confirmed') return false;
                    return dateStr >= p.startDate && dateStr <= p.endDate;
                });
                const projDemand = activeProjs.reduce((sum, p) => sum + (Number(p.headcount) || 0), 0);
                const dispatchDemand = dayLogs.reduce((sum, item) => sum + (Number(item.headcount) || 0), 0);
                const totalDemand = (isWeekend ? 0 : appSettings.baseOps) + projDemand + dispatchDemand;
                const balance = effectiveStaff - totalDemand;

                let loadBadge = '';
                if (isWeekend && totalDemand === 0) {
                    loadBadge = `<span class="text-[11px] text-slate-600">Weekend | 週末</span>`;

                    loadBadge = `<span class="px-2 py-0.5 rounded-full text-[11px] font-bold bg-rose-500/20 text-rose-300 border border-rose-500/30">${totalDemand}/${effectiveStaff} (缺${Math.abs(balance)})</span>`;
                } else if (balance === 0) {
                    loadBadge = `<span class="px-2 py-0.5 rounded-full text-[11px] font-bold bg-amber-500/20 text-amber-300 border border-amber-500/30">${totalDemand}/${effectiveStaff} 滿載</span>`;
                } else {
                    loadBadge = `<span class="px-2 py-0.5 rounded-full text-[11px] font-medium bg-emerald-500/15 text-emerald-300 border border-emerald-500/30">${totalDemand}/${effectiveStaff} (餘${balance})</span>`;
                }

                const rowBg = isWeekend ? 'bg-slate-950/50 text-slate-500' : 'hover:bg-slate-800/40';

                if (dayLogs.length === 0) {
                    rowsHtml.push(`
                        <tr class="${rowBg} transition">
                            <td class="py-2 px-3.5 whitespace-nowrap font-mono">
                                <span class="${isWeekend ? 'text-slate-500' : 'text-slate-200 font-semibold'}">${dateStr}</span>

                                    + Log | 登記

                } else {
                    dayLogs.forEach((log, idx) => {

                document.getElementById('dispatch-id').value = item.id;
                document.getElementById('dispatch-date').value = item.date;
                document.getElementById('dispatch-fab').value = item.fab;
                document.getElementById('dispatch-desc').value = item.description;
                document.getElementById('dispatch-assignee').value = item.assignee;
                document.getElementById('dispatch-headcount').value = item.headcount;
            } else {
                title.textContent = 'Add Daily Field Dispatch & Issue | 登記每日現場派工與異常';
                document.getElementById('dispatch-form').reset();
                document.getElementById('dispatch-id').value = '';
                document.getElementById('dispatch-date').value = prefillDate || `${selectedDispatchMonth}-01`;
                document.getElementById('dispatch-headcount').value = 1;
            }

            modal.classList.remove('hidden');
            modal.classList.add('flex');

        window.saveDailyDispatch = async function (e) {
            e.preventDefault();
            const id = document.getElementById('dispatch-id').value;
            const dateVal = document.getElementById('dispatch-date').value;
            const payload = {
                id: id || 'disp_' + Date.now(),
                date: dateVal,
                fab: document.getElementById('dispatch-fab').value.trim(),
                description: document.getElementById('dispatch-desc').value.trim(),
                assignee: document.getElementById('dispatch-assignee').value.trim(),
                headcount: Math.max(0, parseInt(document.getElementById('dispatch-headcount').value) || 0)
            };

            if (id) {
                const idx = dailyDispatches.findIndex(d => d.id === id);
                if (idx !== -1) dailyDispatches[idx] = payload;
            } else {
                dailyDispatches.push(payload);
            }

            if (dateVal && dateVal.length >= 7) {
                selectedDispatchMonth = dateVal.slice(0, 7);
                const picker = document.getElementById('dispatch-month-picker');
                if (picker) picker.value = selectedDispatchMonth;
            }

            closeDailyDispatchModal();
            recalculateAll(true);
            await persistDispatchToCloud(payload);
            showToast(`Dispatch saved: ${payload.fab} (${payload.assignee}) | 每日派工已儲存同步`);
        };
